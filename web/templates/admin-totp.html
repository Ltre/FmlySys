{{define "admin-totp.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="auth-wrap"><section class="card auth-card"><h1>Google Authenticator 验证</h1><p class="muted">管理员 {{.AdminUsername}}，请输入当前 6 位动态验证码。</p>{{if .Error}}<p class="danger">{{.Error}}</p>{{end}}<form method="post" action="/admin/totp" class="form"><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" autofocus required><button>进入后台</button></form></section></main></body></html>{{end}}
