{{define "admin-totp-setup.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="auth-wrap"><section class="card auth-card"><h1>绑定 Google Authenticator</h1><p>管理员：<strong>{{.AdminUsername}}</strong></p><ol class="steps"><li>打开 Google Authenticator，添加新账号。</li><li>扫描下面二维码；如无法扫码，可手工输入设置密钥。</li><li>输入当前 6 位动态验证码完成绑定。</li></ol><div class="qr-box"><img src="/admin/totp/qr" width="256" height="256" alt="Google Authenticator QR Code"></div><p class="secret"><span class="muted">设置密钥</span><br><code>{{.TOTPSecret}}</code></p><form method="post" action="/admin/totp/setup" class="form"><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" required><button>确认绑定</button></form><details><summary>查看 otpauth URI</summary><code class="audit-json">{{.TOTPURI}}</code></details></section></main></body></html>{{end}}
