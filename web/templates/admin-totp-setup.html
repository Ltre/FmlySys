{{define "admin-totp-setup.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="auth-wrap"><section class="card auth-card"><h1>绑定 Google Authenticator</h1><p>管理员：<strong>{{.AdminUsername}}</strong></p><ol class="steps"><li>先填写一个容易区分环境的“密钥别名”，例如“FmlySys 本机测试”“FmlySys 测试服务器”。</li><li>打开 Google Authenticator，添加新账号并扫描二维码；二维码会随着别名自动更新。</li><li>输入当前 6 位动态验证码完成绑定。</li></ol><label class="upload"><strong>密钥别名</strong><span>该名称会写入验证器账号标签，仅用于区分不同环境，不影响验证码算法。</span><input id="totp-alias" value="{{.AdminUsername}}" maxlength="80" autocomplete="off" placeholder="例如：FmlySys 本机测试"></label><div class="qr-box"><img id="totp-qr" src="/admin/totp/qr" width="256" height="256" alt="Google Authenticator QR Code"></div><p class="secret"><span class="muted">设置密钥</span><br><code id="totp-secret">{{.TOTPSecret}}</code></p><form method="post" action="/admin/totp/setup" class="form"><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" required><button>确认绑定</button></form><details><summary>查看当前 otpauth URI</summary><code id="totp-uri" class="audit-json"></code></details></section></main><script>(function(){const aliasInput=document.getElementById('totp-alias');const qr=document.getElementById('totp-qr');const uriNode=document.getElementById('totp-uri');const secret=document.getElementById('totp-secret').textContent.trim();const fallback={{.AdminUsername}};let timer;function refresh(){const alias=aliasInput.value.trim()||fallback;qr.src='/admin/totp/qr?alias='+encodeURIComponent(alias)+'&v='+Date.now();const params=new URLSearchParams({secret:secret,issuer:'FmlySys',algorithm:'SHA1',digits:'6',period:'30'});uriNode.textContent='otpauth://totp/'+encodeURIComponent('FmlySys:'+alias)+'?'+params.toString();}aliasInput.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(refresh,250);});refresh();})();</script></body></html>{{end}}
