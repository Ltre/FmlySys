{{define "share.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/static/app.css"></head><body>{{template "nav" .}}<main class="wrap"><h1>家族信息共享</h1><section class="card"><h2>新增共享资料</h2><form method="post" action="/share" class="form"><input name="title" placeholder="资料标题" required><select name="category"><option>家族信息</option><option>祖屋 / 宅基地</option><option>墓地 / 祠堂</option><option>办事资料</option><option>证件资料</option><option>照片</option><option>其他</option></select><select name="visibility"><option value="family">全家族可见</option><option value="admin">仅管理员（权限框架占位）</option></select><textarea class="wide" name="content" placeholder="正文、说明、办事经验等"></textarea><button>保存资料</button></form></section><div class="grid">{{range .Archives}}<article class="card"><h2>{{.Title}}</h2><div><span class="tag">{{.Category}}</span> <span class="tag">{{.Visibility}}</span></div><p style="white-space:pre-wrap">{{.Content}}</p>{{range .Attachments}}<a class="attachment" href="/files/{{.ID}}">📎 {{.OriginalName}}</a>{{end}}<form method="post" action="/share/{{.ID}}/attachments" enctype="multipart/form-data" class="form"><input type="file" name="file" required><button>上传附件</button></form></article>{{else}}<p class="muted">暂无共享资料。</p>{{end}}</div></main></body></html>{{end}}
