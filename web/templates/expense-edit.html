{{define "expense-edit.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/static/app.css"></head><body>{{template "nav" .}}<main class="wrap"><h1>编辑公共消费 #{{.Expense.ID}}</h1><section class="card"><p class="muted">当前资金性质：{{if eq .Expense.FundingType "PERSONAL_ADVANCE"}}个人垫付；已报销 ¥{{money .Expense.ReimbursedCent}}，修改金额不能低于已报销额。{{else}}公共资产直接支出；修改金额不能导致原持有人虚拟账户透支。{{end}}</p><form method="post" action="/assets/expenses/{{.Expense.ID}}" class="form"><input name="title" value="{{.Expense.Title}}" required><input name="category" value="{{.Expense.Category}}"><input name="amount" value="{{money .Expense.AmountCent}}" required><input type="datetime-local" name="occurred_at" value="{{formDT .Expense.OccurredAt}}"><input name="payment_channel" value="{{.Expense.PaymentChannel}}" placeholder="支付渠道"><input name="merchant" value="{{.Expense.Merchant}}" placeholder="收款方"><select name="matter_id"><option value="">不关联事务</option>{{range .Matters}}<option value="{{.ID}}" {{if eq .Title $.Expense.MatterTitle}}selected{{end}}>{{.Title}}</option>{{end}}</select><textarea class="wide" name="description">{{.Expense.Description}}</textarea><button>保存修改并记录审计</button></form><p><a href="/assets">← 返回公共资产</a></p></section></main></body></html>{{end}}
